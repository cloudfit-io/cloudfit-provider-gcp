name: Refresh snapshot prices

# Scheduled price refresh for the bundled snapshots shipped by cloudfit-api and
# cloudfit-ui. Pricing is fetched offline here (never on the request path) and
# proposed as a pull request in each data repo. See examples/refresh_prices.py.
#
# Required configuration
# ----------------------
# Secrets:
#   SNAPSHOT_TOKEN  A fine-grained PAT (or app token) with Contents: write and
#                   Pull requests: write on cloudfit-io/cloudfit-api and
#                   cloudfit-io/cloudfit-ui. Used to check those repos out and
#                   open PRs (the default GITHUB_TOKEN cannot reach other repos).
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#                   Workload Identity Federation for read-only Billing Catalog
#                   access. Alternatively set GCP_CREDENTIALS (a service-account
#                   key JSON) and swap the auth step below.
#
# The service account only needs to list the public Cloud Billing catalog
# (no project, no billing-account access required).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays at 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # for Workload Identity Federation
  issues: write            # token-expiry reminder issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Warn ahead of SNAPSHOT_TOKEN expiry: GitHub reports a fine-grained token's
      # expiry in a response header. Under 30 days left, open an issue here (once).
      - name: Check SNAPSHOT_TOKEN expiry
        env:
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          exp=$(curl -sI -H "Authorization: Bearer $SNAPSHOT_TOKEN" \
            https://api.github.com/repos/cloudfit-io/cloudfit-api \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" {print $2}')
          if [ -z "$exp" ]; then
            echo "SNAPSHOT_TOKEN reports no expiry."
            exit 0
          fi
          days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "SNAPSHOT_TOKEN expires $exp ($days days)."
          if [ "$days" -lt 30 ]; then
            echo "::warning::SNAPSHOT_TOKEN expires in $days days ($exp)."
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "SNAPSHOT_TOKEN expires in:title" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "SNAPSHOT_TOKEN expires in $days days" \
                --body "The token the weekly snapshot refresh uses to open pull requests in cloudfit-api and cloudfit-ui expires on $exp. After that, the refresh fails.

          To renew: create a fine-grained token with Contents and Pull requests read/write on cloudfit-api and cloudfit-ui only, then replace the \`SNAPSHOT_TOKEN\` secret in both cloudfit-provider-gcp and cloudfit-provider-aws. Close this issue once done."
            fi
          fi

      - name: Check out cloudfit-provider-gcp
        uses: actions/checkout@v7

      - name: Check out cloudfit-api
        uses: actions/checkout@v7
        with:
          repository: cloudfit-io/cloudfit-api
          path: cloudfit-api
          token: ${{ secrets.SNAPSHOT_TOKEN }}

      - name: Check out cloudfit-ui
        uses: actions/checkout@v7
        with:
          repository: cloudfit-io/cloudfit-ui
          path: cloudfit-ui
          token: ${{ secrets.SNAPSHOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install provider (with Google client libraries)
        run: pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        # Service-account-key alternative (replace the two `with:` lines above):
        #   credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Refresh prices in both snapshots
        run: |
          python examples/refresh_prices.py \
            cloudfit-api/data/gcp_snapshot.json \
            cloudfit-ui/data/gcp_snapshot.json

      # The demo shows when its prices were last refreshed; keep that date in
      # step with the data, but only when prices actually changed.
      - name: Update cloudfit-ui snapshot date
        run: |
          if ! git -C cloudfit-ui diff --quiet -- data/gcp_snapshot.json; then
            sed -i -E "s/^SNAPSHOT_DATE = \"[0-9-]+\"/SNAPSHOT_DATE = \"$(date -u +%F)\"/" cloudfit-ui/app.py
          fi

      - name: Open PR in cloudfit-api
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SNAPSHOT_TOKEN }}
          path: cloudfit-api
          commit-message: "chore: refresh GCP snapshot prices"
          branch: chore/refresh-snapshot-prices
          delete-branch: true
          title: "chore: refresh GCP snapshot prices"
          body: |
            Automated weekly price refresh from the live GCP Billing catalog
            (on-demand, spot, and 1-year committed-use for CPU/RAM instances;
            GPU prices unchanged). Generated by cloudfit-provider-gcp's
            refresh-snapshot workflow.

      - name: Open PR in cloudfit-ui
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SNAPSHOT_TOKEN }}
          path: cloudfit-ui
          commit-message: "chore: refresh GCP snapshot prices"
          branch: chore/refresh-snapshot-prices
          delete-branch: true
          title: "chore: refresh GCP snapshot prices"
          body: |
            Automated weekly price refresh from the live GCP Billing catalog
            (on-demand, spot, and 1-year committed-use for CPU/RAM instances;
            GPU prices unchanged). Generated by cloudfit-provider-gcp's
            refresh-snapshot workflow.
